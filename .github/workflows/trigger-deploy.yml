# @file trigger-deploy.yml
#
# Every push to main (content/translation changes) asks the private deployment repo
# to build and deploy this commit to production. The frontend code and all hosting
# specifics live over there; this repo holds only editorial content.

name: Trigger Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    name: Dispatch deploy
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: iesng
          repositories: landing-page-deploy

      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/iesng/landing-page-deploy/dispatches \
            -f event_type=deploy \
            -f "client_payload[sha]=${{ github.sha }}"
